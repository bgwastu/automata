<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>automata</title>
    <link rel="stylesheet" href="/style.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body class="dashboard">
    <header class="masthead">
      <a class="brand" href="#" aria-label="Automata apps">automata</a>
      <div class="infra">
        <span id="infra"></span>
        <time id="synced"></time>
      </div>
      <div class="system">
        <span id="tunnel"></span>
        <span id="system-task" class="busy"></span>
        <button id="sync" type="button" disabled>Sync</button>
        <details id="account" hidden>
          <summary>Account</summary>
          <div class="account-menu">
            <span id="user"></span>
            <button id="logout" type="button">Sign out</button>
          </div>
        </details>
      </div>
    </header>
    <ul id="alerts" class="alerts" hidden></ul>
    <p id="feedback" class="feedback" role="status" hidden></p>
    <main class="layout">
      <aside class="sidebar" aria-labelledby="apps-title">
        <div class="list-heading">
          <h1 id="apps-title" tabindex="-1">Apps</h1>
          <span id="app-count"></span>
        </div>
        <nav aria-label="Apps"><ul id="apps" class="app-list"></ul></nav>
        <p id="empty" class="empty" role="status">Loading apps…</p>
        <span id="version" class="version"></span>
      </aside>
      <section id="workspace" class="workspace" aria-labelledby="app-name" hidden>
        <a class="back" href="#">← Apps</a>
        <header class="app-heading">
          <div>
            <h2 id="app-name" tabindex="-1"></h2>
            <span id="app-status" class="status"></span>
          </div>
          <div class="actions">
            <button id="restart" type="button">Restart</button>
            <button id="backup" type="button">Back up now</button>
          </div>
        </header>
        <p id="app-error" class="app-error" hidden></p>
        <nav class="tabs" aria-label="App views">
          <a data-view="overview">Overview</a>
          <a data-view="logs">Logs</a>
          <a data-view="task">Last task</a>
          <a data-view="backups">Backups</a>
        </nav>
        <div id="overview" class="overview" hidden></div>
        <section id="output" class="output" aria-label="Live output" hidden>
          <p id="stream-status" class="muted" role="status"></p>
          <pre id="log" tabindex="0" aria-label="Output" hidden></pre>
        </section>
        <section id="snapshots" class="snapshots" aria-label="Backups" hidden>
          <p id="backup-summary" class="muted"></p>
          <div id="snapshot-list"></div>
        </section>
      </section>
      <p id="unavailable" class="unavailable" tabindex="-1" hidden></p>
    </main>
  </body>
</html>
