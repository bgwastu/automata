<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>automata</title>
    <link rel="stylesheet" href="/style.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <header>
      <strong class="brand">automata</strong>
      <span id="infra" class="group"></span>
      <span id="synced" class="muted"></span>
      <button id="sync" class="btn" title="Pull the infra repo and reconcile (s)">Sync</button>
      <span class="grow"></span>
      <span id="status" class="group"></span>
      <span id="user" class="muted"></span>
      <button id="logout" class="btn" hidden>Sign out</button>
    </header>
    <div id="alerts"></div>
    <main>
      <div id="apps"></div>
      <p id="empty" hidden>
        No apps yet. Add <code>apps/&lt;name&gt;/automata.yml</code> to the infra repo and push.
      </p>
    </main>
    <section id="pane" hidden>
      <div class="bar">
        <strong id="pane-name"></strong>
        <span id="pane-source" class="group muted"></span>
        <span class="grow"></span>
        <span id="actions" class="group"></span>
        <button id="close" class="btn" title="Close (Esc)">Close</button>
      </div>
      <div class="bar tabs" id="tabs">
        <button data-tab="logs" title="l">Logs</button>
        <button data-tab="task" title="t">Last task</button>
        <button data-tab="backups">Backups</button>
      </div>
      <pre id="out"></pre>
    </section>
  </body>
</html>
