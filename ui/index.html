<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>automata</title>
    <link rel="stylesheet" href="/style.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <header>
      <strong>automata</strong>
      <span id="infra"></span>
      <span id="synced" class="muted"></span>
      <button id="sync" title="Pull the infra repo and reconcile (s)">sync</button>
      <span class="grow"></span>
      <span id="tunnel"></span>
    </header>
    <div id="alerts"></div>
    <main>
      <table>
        <thead>
          <tr><th>app</th><th>status</th><th>domain</th><th>release</th><th>deployed</th><th>backup</th></tr>
        </thead>
        <tbody id="apps"></tbody>
      </table>
      <p id="empty" hidden>
        No apps yet. Add <code>apps/&lt;name&gt;/automata.yml</code> to the infra repo and push.
      </p>
    </main>
    <section id="pane" hidden>
      <div class="bar">
        <strong id="pane-name"></strong>
        <span id="pane-source" class="muted"></span>
        <span class="grow"></span>
        <span id="actions"></span>
      </div>
      <div class="bar tabs" id="tabs">
        <button data-tab="logs">logs</button>
        <button data-tab="task">last task</button>
        <button data-tab="backups">backups</button>
      </div>
      <pre id="out"></pre>
    </section>
  </body>
</html>
