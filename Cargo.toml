[package]
name = "automata"
version = "0.2.8"
edition = "2024"
rust-version = "1.85"
description = "Small self-hosted PaaS: Docker Compose apps, Cloudflare Tunnel routing, R2 backups"
license = "MIT"
repository = "https://github.com/bgwastu/automata"

[dependencies]
age = { version = "0.12", default-features = false }
anyhow = "1"
async-stream = "0.3"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query", "json", "form"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
croner = "3"
flate2 = "1"
futures = "0.3"
hex = "0.4"
hmac = "0.12"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
ring = "0.17"
rusty-s3 = "0.10.2"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "0.10"
subtle = "2"
tar = "0.4"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkdir = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true
